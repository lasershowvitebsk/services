<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaserShow Widget — Демо</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 40px 20px;
        }
        h1 { color: #00e5ff; font-size: 1.8rem; }
        p  { color: #888; font-size: 1rem; }
        .demo-btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .demo-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(13,110,253,0.5);
            background: rgba(13,110,253,0.15);
            color: #e0e0e0;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .demo-btn:hover { background: rgba(13,110,253,0.35); }
    </style>
</head>
<body>

    <h1>💡 LaserShow Widget — Демо</h1>
    <p>Кнопка 💬 появится внизу справа</p>

    <div class="demo-btns">
        <button class="demo-btn" onclick="LaserChatWidget.setLang('en')">EN</button>
        <button class="demo-btn" onclick="LaserChatWidget.setLang('ru')">RU</button>
    </div>

    <!-- Шаг 1: конфиг -->
    <script>
        window.LaserChatConfig = {
            workerUrl:   'https://laser-api.vitalitalipski.workers.dev',
            lang:        'ru',
            position:    'right',
            accentColor: '#0d6efd'
        };
    </script>

    <!-- Шаг 2: подключаем JS виджета -->
    <script src="../widget/laser-chat-widget.js"></script>

</body>
</html>
