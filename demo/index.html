<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LaserShow Widget — Демо</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 40px 20px;
        }

        h1 {
            color: #00e5ff;
            font-size: 1.9rem;
            text-align: center;
        }

        p {
            color: #999;
            font-size: 1rem;
            text-align: center;
            max-width: 760px;
            line-height: 1.5;
        }

        code {
            padding: 3px 7px;
            border-radius: 6px;
            background: rgba(255,255,255,.08);
            color: #00e5ff;
        }

        .demo-panel {
            width: min(820px, 100%);
            padding: 20px;
            border-radius: 18px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.08);
        }

        .demo-panel h2 {
            margin-bottom: 14px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
        }

        .demo-btn {
            padding: 9px 14px;
            border-radius: 20px;
            border: 1px solid rgba(13,110,253,.5);
            background: rgba(13,110,253,.15);
            color: #e0e0e0;
            cursor: pointer;
            font-size: .9rem;
            transition: background .18s, transform .12s;
        }

        .demo-btn:hover {
            background: rgba(13,110,253,.35);
            transform: translateY(-1px);
        }

        .demo-note {
            font-size: .9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <h1>💡 LaserShow Widget — Демо</h1>

    <p>
        Виджет настраивается через объект <code>window.LaserChatConfig</code>.
        Можно менять положение, цвет, отступы, размеры, активность, тексты и поведение.
    </p>

    <div class="demo-panel">
        <h2>Быстрая проверка положения и отступов</h2>

        <div class="demo-grid">
            <button class="demo-btn" onclick="LaserChatWidget.setConfig({ position: 'bottom-right' })">
                Снизу справа
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.setConfig({ position: 'bottom-left' })">
                Снизу слева
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.setConfig({ position: 'top-right' })">
                Сверху справа
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.setConfig({ position: 'top-left' })">
                Сверху слева
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.setConfig({ offsetX: '8px', offsetY: '8px' })">
                Отступ 8px
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.setConfig({ offsetX: '24px', offsetY: '24px' })">
                Отступ 24px
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.setConfig({ offsetX: '24px', offsetY: '110px' })">
                Поднять выше
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.setConfig({ accentColor: '#ff3b30', colors: { accent: '#ff3b30', toggleBg: '#ff3b30', headerBg: '#ff3b30', userMessageBg: '#ff3b30' } })">
                Красный цвет
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.setConfig({ accentColor: '#0d6efd', colors: { accent: '#0d6efd', toggleBg: '#0d6efd', headerBg: '#0d6efd', userMessageBg: '#0d6efd' } })">
                Синий цвет
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.open()">
                Открыть чат
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.close()">
                Закрыть чат
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.disable()">
                Выключить
            </button>

            <button class="demo-btn" onclick="LaserChatWidget.enable()">
                Включить
            </button>
        </div>
    </div>

    <p class="demo-note">
        Для реального сайта можно оставить только блок настроек и подключение JS-файла.
    </p>

    <script>
        window.LaserChatConfig = {
            workerUrl: 'https://laser-api.vitalitalipski.workers.dev',
            endpointPath: '/chat',

            enabled: true,

            position: 'bottom-right',

            accentColor: '#0d6efd',

            offsetX: '8px',
            offsetY: '8px',

            mobileOffsetX: '12px',
            mobileOffsetY: '12px',

            buttonSize: '60px',
            mobileButtonSize: '50px',

            windowWidth: '360px',
            messagesMaxHeight: '350px',

            mobileWindowSideOffset: '8px',

            zIndex: 9999,

            animation: true,
            openOnLoad: false,
            showGreeting: true,

            closeOnOutsideClick: true,
            closeOnEsc: true,
            focusOnOpen: true,

            maxMessageLength: 500,
            requestTimeout: 30000,

            showChips: true,

            chips: [
                { id: 'prices', label: '💰 Цены' },
                { id: 'stories', label: '🎬 Сюжеты' },
                { id: 'order', label: '📋 Как заказать' },
                { id: 'contacts', label: '📞 Контакты' }
            ],

            payloadExtra: {
                site: 'demo',
                source: 'laser-widget'
            },

            icons: {
                open: '💬',
                close: '✕',
                send: '➤'
            },

            texts: {
                title: 'Чат с консультантом',
                greeting: 'Здравствуйте! Чем могу помочь? 👋',
                you: 'Вы',
                bot: 'Бот',
                placeholder: 'Спросите о ценах и услугах...',
                send: '➤',
                loading: '...',
                error: 'Ошибка',
                close: 'Закрыть',
                chips: {
                    prices: '💰 Цены',
                    stories: '🎬 Сюжеты',
                    order: '📋 Как заказать',
                    contacts: '📞 Контакты'
                }
            },

            colors: {
                accent: '#0d6efd',

                toggleBg: '#0d6efd',
                toggleText: '#ffffff',
                toggleShadow: 'rgba(13,110,253,.4)',
                waveColor: 'rgba(13,110,253,.55)',

                windowBg: '#1a1a2e',
                windowBorder: '#333',
                windowShadow: 'rgba(0,0,0,.5)',

                headerBg: '#0d6efd',
                headerText: '#ffffff',

                messagesBg: '#1a1a2e',

                botMessageBg: '#2d2d44',
                botMessageText: '#e0e0e0',

                userMessageBg: '#0d6efd',
                userMessageText: '#ffffff',

                inputRowBg: '#0d0d1a',

                inputBg: '#2d2d44',
                inputText: '#ffffff',
                inputPlaceholder: '#888',
                inputBorder: 'transparent',
                inputFocusBorder: 'rgba(13,110,253,.55)',

                chipBg: 'rgba(13,110,253,.1)',
                chipBgHover: 'rgba(13,110,253,.3)',
                chipBorder: 'rgba(13,110,253,.4)',
                chipText: '#aaa',
                chipTextHover: '#ffffff',

                link: '#00e5ff',

                typingDot: '#6c8ebf',

                labelText: 'inherit'
            },

            debug: true
        };
    </script>

    <script src="../widget/laser-chat-widget.js"></script>

</body>
</html>
